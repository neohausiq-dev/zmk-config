# Corne v3.6 (Boardsource) on nice!nano v2 with OLED-S 4-pin I2C screens.

# OLED-S screens (stock corne shield drives the I2C SSD1306)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Blank the OLEDs after 10 s idle to save battery; deep sleep after 8 min
CONFIG_ZMK_IDLE_TIMEOUT=10000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=480000

# Report the right half's battery to the central so the OLED/host can show it
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
